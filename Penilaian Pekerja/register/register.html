<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Pendaftaran - Sistem Penilaian Pekerja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="flex items-center justify-center min-h-screen p-4 py-12">

  <div class="neu-card p-10 w-full max-w-md">
    <div class="text-center mb-6">
      <span class="px-3.5 py-1 bg-blue-100 text-blue-700 text-xs font-bold rounded-full uppercase tracking-wider">Akaun Rasmi</span>
      <h1 class="text-2xl font-extrabold text-slate-900 mt-3">Daftar Pangkalan Data</h1>
      <p class="text-xs text-slate-500 mt-1">Had keselamatan: 1 Admin & 1 Owner dibenarkan.</p>
    </div>

    <form class="space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Nama Penuh</label>
        <input type="text" required placeholder="Ahmad bin Ali" class="neu-card-inset w-full px-4 py-3 text-sm outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">ID Pekerja</label>
        <input type="text" required placeholder="EMP-001" class="neu-card-inset w-full px-4 py-3 text-sm outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Peranan Akses (Role)</label>
        <select required class="neu-card-inset w-full px-4 py-3 text-sm outline-none bg-transparent">
          <option value="" disabled selected>Pilih Peranan Anda</option>
          <option value="Admin">Admin (Had 1 Sahaja)</option>
          <option value="Owner">Owner (Had 1 Sahaja)</option>
          <option value="Supervisor">Supervisor</option>
          <option value="Staff">Staff</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">E-Mel Rasmi</label>
        <input type="email" required placeholder="anda@syarikat.com" class="neu-card-inset w-full px-4 py-3 text-sm outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Kata Laluan</label>
        <input type="password" required minlength="6" placeholder="Min 6 aksara" class="neu-card-inset w-full px-4 py-3 text-sm outline-none">
      </div>

      <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-2xl shadow-xl transition text-sm mt-2">
        Daftar Akaun Baru
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-500 pt-4 border-t border-slate-200">
      Sudah berdaftar? <a href="../login/login.html" class="text-blue-600 font-bold hover:underline">Log Masuk</a>
    </div>
  </div>

</body>
</html>
