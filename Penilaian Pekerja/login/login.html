<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Log Masuk - Sistem Penilaian Pekerja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <div class="neu-card p-10 w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-slate-900 text-white flex items-center justify-center text-2xl shadow-lg">
        <i class="ri-shield-user-line"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900">Log Masuk Sistem</h1>
      <p class="text-xs text-slate-500 mt-1">Akses papan pemuka mengikut peranan anda secara automatik.</p>
    </div>

    <form class="space-y-5">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">E-Mel Rasmi</label>
        <input type="email" required placeholder="anda@syarikat.com" class="neu-card-inset w-full px-4 py-3.5 text-sm outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Kata Laluan</label>
        <input type="password" required placeholder="••••••••" class="neu-card-inset w-full px-4 py-3.5 text-sm outline-none">
      </div>

      <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-2xl shadow-xl transition text-sm">
        Log Masuk Akaun
      </button>
    </form>

    <div class="mt-8 text-center text-xs text-slate-500 pt-6 border-t border-slate-200">
      Belum mempunyai akaun? <a href="../register/register.html" class="text-blue-600 font-bold hover:underline">Daftar di sini</a>
    </div>
  </div>

</body>
</html>
